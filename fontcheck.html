<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Font check 2</title>
<link rel="stylesheet" href="https://use.typekit.net/csi6fno.css?v=2026-11-05b">
<style>
body{margin:0;padding:16px;font:16px/1.6 -apple-system,system-ui,sans-serif;background:#fff;color:#111}
h1{font-size:20px;margin:0 0 8px}
.t{font-size:22px;line-height:1.4;border:1px solid #ccc;border-radius:10px;padding:8px 12px;margin:8px 0;font-family:'thonglor-soi-4',monospace}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;background:#f4f4f4;padding:10px;border-radius:8px}
</style>
</head>
<body>
<h1>ตรวจฟอนต์ ครั้งที่ 2</h1>
<p>รอ 10 วินาที แล้วแคปทั้งหน้า (เลื่อนลงแคปจนจบ)</p>
<div class="t" style="font-weight:400">400 ข้าวตังทรงเครื่อง Abc 123</div>
<div class="t" style="font-weight:700">700 ข้าวตังทรงเครื่อง Abc 123</div>
<pre id="out">กำลังตรวจ…</pre>
<script>
(async function(){
  var out=[];
  function L(s){out.push(s);document.getElementById('out').textContent=out.join('\n')}
  L('UA: '+navigator.userAgent);
  L('online: '+navigator.onLine+' | width '+innerWidth+' | dpr '+devicePixelRatio);
  L('page: '+location.href);
  var fonts={};
  for (var w of ['400','600','700','800']){
    try{ var r=await document.fonts.load(w+' 24px "thonglor-soi-4"','ก'); fonts[w]=r.length?'OK':'not defined' }
    catch(e){ fonts[w]='ERROR: '+(e&&e.message) }
  }
  L('--- document.fonts.load ---');
  for (var k in fonts) L('Thonglor '+k+': '+fonts[k]);

  async function tryFetch(label,url,opts){
    try{
      var r=await fetch(url,opts||{});
      var info=r.type+' '+r.status;
      if(r.type!=='opaque'){ var b=await r.arrayBuffer(); info+=' '+b.byteLength+' bytes' }
      L(label+': '+info);
      return r;
    }catch(e){ L(label+': FAIL '+(e&&e.name)+' '+(e&&e.message)); }
  }
  L('--- network tests ---');
  var css=null;
  try{
    var r=await fetch('https://use.typekit.net/csi6fno.css?v=2026-11-05b');
    css=await r.text();
    L('kit css: '+r.status+' '+css.length+' chars, @font-face x'+(css.match(/@font-face/g)||[]).length);
  }catch(e){ L('kit css: FAIL '+(e&&e.name)+' '+(e&&e.message)) }
  if(css){
    var urls=[],re=/url\("([^"]+)"\)\s*format\("woff2"\)/g,m;
    while(m=re.exec(css)) urls.push(m[1]);
    L('font urls found: '+urls.length);
    for (var i=0;i<urls.length;i++){
      await tryFetch('font file '+(i+1)+' (cors)',urls[i]);
      await tryFetch('font file '+(i+1)+' (no-cors)',urls[i],{mode:'no-cors'});
    }
    if(urls[0]) L('first url: '+urls[0].slice(0,110));
  }
  await tryFetch('p.typekit.net',"https://p.typekit.net/p.css?s=1&k=csi6fno&ht=tk&f=55653&a=40324188&app=typekit&e=css",{mode:'no-cors'});
  await tryFetch('google fonts css','https://fonts.googleapis.com/css2?family=Prompt:wght@400',{mode:'no-cors'});
  await tryFetch('github pages self','fontcheck.html');
  L('--- done ---');
})();
</script>
</body>
</html>
